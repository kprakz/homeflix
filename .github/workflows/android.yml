# Builds the Android app (the phone server): ffmpeg from FFmpeg's source with the NDK, the official
# Node.js runtime for Android (checksum pinned), then the APK, which is attached to the release.
#
# Runs when a release is published, or by hand (Actions → Android build → Run workflow), optionally
# attaching the APK to an existing release tag. Signed with the HOMEFLIX key when the repository has
# the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
# secrets; otherwise with a throwaway debug key (fine for testing, not for releases people keep).

name: Android build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the APK to (leave empty to only build)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ffmpeg takes ~10 minutes to compile: reuse it until the build script changes.
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: android/build/ffmpeg
          key: android-ffmpeg-${{ hashFiles('android/scripts/build-ffmpeg.sh') }}

      - name: Build ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        # GitHub's Ubuntu machines come with the NDK; its path is a shell variable there.
        run: ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" bash android/scripts/build-ffmpeg.sh

      - name: Get the Node.js runtime
        run: bash android/scripts/fetch-native.sh

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/homeflix.jks"
            echo "HOMEFLIX_KEYSTORE=$RUNNER_TEMP/homeflix.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key in secrets: the APK is signed with a debug key."
          fi

      - name: Build the APK
        working-directory: android
        env:
          HOMEFLIX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HOMEFLIX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HOMEFLIX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          version=$(node -p "require('../package.json').version")
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/HOMEFLIX-$version-android-arm64.apk"
          ls -la out

      # The APK must carry Node.js, ffmpeg, ffprobe, the bridge and the server itself.
      - name: Check the APK
        working-directory: android/out
        run: |
          set -euo pipefail
          apk=$(ls *.apk)
          unzip -l "$apk" > contents.txt
          for f in lib/arm64-v8a/libnode.so lib/arm64-v8a/libffmpeg.so lib/arm64-v8a/libffprobe.so lib/arm64-v8a/libhomeflix_native.so \
                   lib/arm64-v8a/libc++_shared.so assets/nodejs-project/server.js assets/nodejs-project/main.js assets/nodejs-project/public/index.html; do
            grep -q " $f$" contents.txt && echo "ok  $f" || { echo "MISSING $f"; exit 1; }
          done
          rm contents.txt
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk" | head -3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: HOMEFLIX-android
          path: android/out/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-ffmpeg
          path: android/build/ffmpeg

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" android/out/*.apk --clobber
