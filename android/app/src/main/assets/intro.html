<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOMEFLIX</title>
<style>
@font-face {
  font-family: 'Bebas Neue';
  src: url('bebas_neue.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
}
:root{--red:#e50914;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#000;color:#fff}
.stage{position:relative;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000}
.word{display:flex;font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;font-size:clamp(3rem,14vw,10rem);letter-spacing:.04em;color:var(--red);position:relative;z-index:2;will-change:transform,opacity}
.word span{display:inline-block;opacity:0;text-shadow:0 0 18px rgba(229,9,20,.55),0 0 60px rgba(229,9,20,.35)}
.streaks{position:absolute;inset:0;z-index:1;pointer-events:none}
.streaks i{position:absolute;top:0;bottom:0;opacity:0;transform:scaleY(0)}
.glow{position:absolute;inset:0;z-index:0;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(229,9,20,.5),transparent 55%)}
.play .word span{animation:in .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.09s + .3s)}
.play .word{animation:zoom 1.6s cubic-bezier(.7,0,.9,.4) 2.3s forwards}
.play .streaks i{animation:streak 1.8s ease-out forwards;animation-delay:var(--d)}
.play .glow{animation:flash 2.2s ease-in-out 2.1s forwards}
@keyframes in{0%{opacity:0;transform:translateY(-40px) scaleY(1.6);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
@keyframes zoom{0%{transform:scale(1);opacity:1;filter:blur(0)}70%{opacity:1}100%{transform:scale(14);opacity:0;filter:blur(8px)}}
@keyframes streak{0%{opacity:0;transform:scaleY(0)}30%{opacity:.9;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1)}}
@keyframes flash{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
button{position:absolute;z-index:3;bottom:max(32px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:transparent;color:#fff;border:1px solid #666;border-radius:4px;padding:10px 22px;font:500 14px system-ui,sans-serif;letter-spacing:.08em;cursor:pointer;opacity:0;transition:opacity .4s,border-color .2s}
button.show{opacity:1}
button:hover{border-color:var(--red)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="glow"></div>
  <div class="streaks" id="streaks"></div>
  <div class="word" id="word" aria-label="HOMEFLIX"></div>
  <button id="replay" type="button">REPLAY</button>
</div>
<script>
(function(){
  var stage=document.getElementById('stage'),word=document.getElementById('word'),
      streaks=document.getElementById('streaks'),btn=document.getElementById('replay');
  'HOMEFLIX'.split('').forEach(function(ch,i){
    var s=document.createElement('span');s.textContent=ch;s.style.setProperty('--i',i);word.appendChild(s);
  });
  var colors=['#e50914','#ff3b30','#3a5bff','#8a2be2','#ff6a00','#00b3ff'];
  for(var k=0;k<70;k++){
    var l=document.createElement('i');
    var w=1+Math.random()*3;
    var c=colors[Math.floor(Math.random()*colors.length)];
    l.style.left=(Math.random()*100)+'%';
    l.style.width=w+'px';
    l.style.background='linear-gradient(to bottom,transparent,'+c+' 50%,transparent)';
    l.style.boxShadow='0 0 12px '+c;
    l.style.setProperty('--d',(2.2+Math.random()*0.9).toFixed(2)+'s');
    streaks.appendChild(l);
  }
  function play(){
    btn.classList.remove('show');
    stage.classList.remove('play');
    void stage.offsetWidth;
    stage.classList.add('play');
    setTimeout(function(){btn.classList.add('show');},4800);
  }
  btn.addEventListener('click',play);
  play();
})();
</script>
</body>
</html>
